[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloakos-vector-edition"
version = "0.3.0"
description = "CloakOS Vector Edition: a living-creature brain for Anki/DDL Vector, running on your Mac or PC."
requires-python = ">=3.11"
dependencies = [
  "grpcio>=1.66.2",
  "protobuf>=5.27.2",
  "cryptography>=42",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "pyyaml>=6",
  "python-dotenv>=1",
  "numpy>=1.26",
  "pillow>=10",
  "scipy>=1.11",
  "mujoco>=3.2",
  "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
kokoro = ["kokoro-onnx>=0.4"]
piper = ["piper-tts>=1.2"]
ears = ["sounddevice>=0.4"]
rl = ["torch>=2.2", "stable-baselines3>=2.3", "gymnasium>=0.29"]
ml = ["torch>=2.2", "transformers>=4.45"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "gymnasium>=0.29"]
proto = ["grpcio-tools>=1.66.2"]

[project.scripts]
cloakos = "cloakos.__main__:main"

[tool.setuptools.packages.find]
include = ["cloakos*"]

[tool.setuptools.package-data]
cloakos = ["web/static/*", "web/static/pair/*", "web/static/vendor/*", "vector/proto/*.proto", "rl/pretrained/*.json", "rl/pretrained/*/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
