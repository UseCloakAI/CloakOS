[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloak-vector"
version = "0.1.0"
description = "Cloak for Vector: a living-creature brain for Anki/DDL Vector, running on your PC."
requires-python = ">=3.11"
dependencies = [
  "grpcio>=1.66.2",
  "protobuf>=5.27.2",
  "cryptography>=42",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "pyyaml>=6",
  "python-dotenv>=1",
  "numpy>=1.26",
  "pillow>=10",
  "scipy>=1.11",
]

[project.optional-dependencies]
kokoro = ["kokoro-onnx>=0.4"]
piper = ["piper-tts>=1.2"]
ears = ["sounddevice>=0.4"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
proto = ["grpcio-tools>=1.66.2"]

[project.scripts]
cloak-vector = "cloak_vector.__main__:main"

[tool.setuptools.packages.find]
include = ["cloak_vector*"]

[tool.setuptools.package-data]
cloak_vector = ["web/static/*", "vector/proto/*.proto"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
